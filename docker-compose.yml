services:
  ironsight:
    # Pulled from Docker Hub (basabbink/ironsight:latest). For a local rebuild
    # use `docker compose up --build` — build still works even with `image` set.
    image: basabbink/ironsight:latest
    build: .
    pull_policy: always
    container_name: ironsight
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Airlines watched by /api/airline-deviations (ICAO codes or names,
      # comma-separated). Unset = Emirates only.
      - WATCHED_AIRLINES=UAE,ETD,QTR
    restart: unless-stopped