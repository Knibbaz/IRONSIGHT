name: Docker Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine next version
        id: version
        run: |
          # Pull existing tags from the (public) Docker Hub registry and bump
          # the patch of the highest semver: 1.0.4 -> 1.0.5, etc. Falls back to
          # 1.0.4 when the registry has no tags yet.
          tags=$(curl -s "https://hub.docker.com/v2/repositories/basabbink/ironsight/tags?page_size=100" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(' '.join(t['name'] for t in d.get('results',[])))" 2>/dev/null || true)
          echo "Existing tags: $tags"
          next=$(python3 - "$tags" <<'PY'
          import sys, re
          tags = sys.argv[1].split()
          vers = []
          for t in tags:
              m = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)', t)
              if m:
                  vers.append(tuple(int(x) for x in m.groups()))
          if vers:
              major, minor, patch = max(vers)
              patch += 1
          else:
              major, minor, patch = 1, 0, 4
          print(f"{major}.{minor}.{patch}")
          PY
          )
          echo "Next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            basabbink/ironsight:${{ steps.version.outputs.version }}
            basabbink/ironsight:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max